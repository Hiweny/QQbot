name: Build Android APK

on:
  push:
    branches: [ main ]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: sdkmanager --install "platforms;android-34" "build-tools;34.0.0" "platform-tools" > /dev/null || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Decode signing keystore
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> "$GITHUB_ENV"
            echo "签名已启用"
          else
            echo "未配置签名密钥，将使用 debug 签名"
          fi

      - name: Build release APK
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.${{ github.run_number }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Collect APK
        run: |
          set -e
          SRC=$(find android/app/build/outputs/apk/release -name '*.apk' | head -n 1)
          echo "找到 APK: $SRC"
          cp "$SRC" QQBot.apk
          ls -lh QQBot.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: QQBot-apk
          path: QQBot.apk

      - name: Remove stale release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete-asset apk QQBot.apk -y || true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk
          name: 安卓应用
          make_latest: true
          body: |
            QQBot AI — Android 客户端（WebView 外壳）

            - 版本：1.${{ github.run_number }}（versionCode ${{ github.run_number }}）
            - 构建时间：${{ github.event.repository.updated_at }}
            - 说明：直接加载线上网页 https://hiweny.github.io/QQbot/ ，网页更新后 App 自动同步
            - 支持覆盖更新（同一签名，安装时直接覆盖旧版本）

            固定下载直链：
            https://github.com/${{ github.repository }}/releases/latest/download/QQBot.apk
          files: QQBot.apk
          fail_on_unmatched_files: true
